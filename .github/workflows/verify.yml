# Group 4 self-checks: golden-model regression, riscv-arch-test compliance and
# Yosys 0.33 synthesis check. Independent of the course RISC-n-Roll CI app.
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RISCV_PREFIX: riscv64-unknown-elf-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: YosysHQ/setup-oss-cad-suite@v3     # Icarus Verilog (recent)
      - name: Install RISC-V GCC and Yosys 0.33
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf
          pip install "yowasp-yosys==0.33.*"
      - name: Synthesis check (Yosys 0.33, as in course CI)
        run: python scripts/synth_check.py --yosys yowasp-yosys
      - name: Golden-model regression (CI memory model)
        run: python scripts/run_random.py
      - name: riscv-arch-test 2.7.4 compliance (M and I)
        run: |
          curl -sL https://codeload.github.com/riscv-non-isa/riscv-arch-test/tar.gz/refs/tags/2.7.4 | tar xz
          python scripts/run_compliance.py --arch-test riscv-arch-test-2.7.4 --suite M I --report build/compliance-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            build/compliance-report
            build/synth/yosys.log
